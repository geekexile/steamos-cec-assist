# Copy to ~/.config/cec-assist/config.ini and edit, then:
#   systemctl --user restart cec-assist
[daemon]
# Seconds to wait after the TV's last routing message before claiming
# active source (the TV sends two messages per input switch).
settle_seconds = 1.0

# Claim active source when the Steam Controller is used (button / D-pad
# presses only). Needed for TVs whose built-in apps switch inputs without
# any CEC announcement. Side effect: using the controller while the TV shows
# another source switches the TV to this device ("one-touch play").
controller_trigger = true
controller_cooldown_seconds = 30
# Input device names (substring match, comma separated) that count as "the controller".
controller_names = Steam Controller, X-Box 360 pad, Steam Deck

# Log every CEC routing message to the journal (journalctl --user -u cec-assist).
log_routing = true
